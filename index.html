<!DOCTYPE html>
<html lang="es" data-phase="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f0f4ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Skincare Ritual ✦</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

  <!-- Z-0: Core — Mesh Gradient Background -->
  <div class="layer-core" aria-hidden="true">
    <div class="mesh-gradient"></div>
  </div>

  <!-- Z-10: Atmosphere — Grain + Particles -->
  <div class="layer-atmosphere" aria-hidden="true">
    <canvas id="grain-canvas" class="grain-overlay"></canvas>
    <canvas id="particles-canvas" class="particles-layer"></canvas>
  </div>

  <!-- Z-20: Main Stage -->
  <main class="app-main" id="app-root">

    <!-- HEADER ÉCLAT -->
    <header class="header-eclat">
      <div class="header-inner">
        <div class="header-text-block">
          <h1 class="header-title">Ritual de<br><em>Cuidado</em></h1>
          <time class="header-time" id="header-clock"></time>
        </div>
        <div class="phase-pill premium-glass" id="phase-pill">
          <span class="phase-pill__icon" aria-hidden="true">☀️</span>
          <div class="phase-pill__info">
            <span class="phase-pill__label">Protección</span>
            <span class="phase-pill__solar">
              <span id="solar-sunrise">--:--</span> · <span id="solar-sunset">--:--</span>
            </span>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENIDO DE RUTINA -->
    <div class="routine-container" id="routine-container">
      <!-- Tabs Mañana/Noche -->
      <nav class="routine-tabs" role="tablist" aria-label="Seleccionar rutina">
        <button class="tab-btn active" role="tab" data-routine="morning" aria-selected="true">
          <span class="tab-icon">🌸</span> Mañana
        </button>
        <button class="tab-btn" role="tab" data-routine="night" aria-selected="false">
          <span class="tab-icon">🌙</span> Noche
        </button>
      </nav>

      <!-- Steps se inyectan desde app.js -->
      <div class="steps-list" id="steps-list" role="list"></div>

      <!-- Progress ring -->
      <div class="progress-wrap" aria-live="polite">
        <svg class="progress-ring" width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="progress-ring__bg" cx="36" cy="36" r="30"/>
          <circle class="progress-ring__fill" cx="36" cy="36" r="30" id="progress-circle"/>
        </svg>
        <span class="progress-label" id="progress-label">0 / 0</span>
      </div>
    </div>
  </main>

  <!-- Z-30: Floating Dock -->
  <nav class="floating-dock" role="navigation" aria-label="Navegación principal">
    <button class="dock-btn active" data-view="home" aria-label="Inicio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <button class="dock-btn" data-view="calendar" aria-label="Historial">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
    <button class="dock-btn" data-view="products" aria-label="Productos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    </button>
    <button class="dock-btn" data-view="settings" aria-label="Ajustes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M12 2v2M12 20v2M2 12h2M20 12h2M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41"/></svg>
    </button>
  </nav>

  <script type="module" src="solar-engine.js"></script>
  <script type="module" src="atmosphere.js"></script>
  <script type="module" src="features.js"></script>
  <script type="module" src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
