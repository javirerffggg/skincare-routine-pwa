<!DOCTYPE html>
<html lang="es" data-phase="day" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta id="metaThemeColor" name="theme-color" content="#F0F8FF">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Skincare Ritual ✦</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

  <!-- Fondo circadiano -->
  <div id="auraBg" class="aura-bg"></div>
  <div class="orb-layer" aria-hidden="true">
    <div id="orb1" class="orb"></div>
    <div id="orb2" class="orb"></div>
    <div id="orb3" class="orb"></div>
  </div>
  <canvas id="grainCanvas" class="grain-canvas"></canvas>

  <!-- APP -->
  <div id="app" class="app-wrapper">

    <!-- HEADER -->
    <header class="header-eclat">
      <div class="header-top">
        <div class="header-text-block">
          <p id="currentDate" class="header-date"></p>
          <h1 class="header-title">Ritual de<br><em>Cuidado</em></h1>
        </div>
        <div class="header-actions">
          <div class="phase-pill premium-glass">
            <span class="phase-pill__icon">☀️</span>
            <div class="phase-pill__info">
              <span class="phase-pill__label">Protección</span>
              <span class="phase-pill__solar">
                <span id="solar-sunrise">--:--</span> · <span id="solar-sunset">--:--</span>
              </span>
            </div>
          </div>
          <button id="themeToggle" class="theme-btn premium-glass" aria-label="Cambiar tema">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>
      <p id="circadianLabel" class="circadian-label"></p>
      <div class="day-card premium-glass">
        <div class="card-glow-overlay" aria-hidden="true"></div>
        <div class="day-card-inner">
          <span id="dayBadge" class="day-badge"></span>
          <span id="dayTitle" class="day-title"></span>
        </div>
      </div>
    </header>

    <!-- TABS -->
    <nav class="tabs-nav" role="tablist">
      <button class="tab-btn active" data-tab="hoy"    role="tab">Hoy</button>
      <button class="tab-btn"        data-tab="manana" role="tab">Mañana</button>
      <button class="tab-btn"        data-tab="semana" role="tab">Semana</button>
      <button class="tab-btn"        data-tab="tips"   role="tab">Consejos</button>
    </nav>

    <!-- TAB: HOY -->
    <section id="tab-hoy" class="tab-content active" role="tabpanel">

      <!-- RUTINA MAÑANA -->
      <div id="morning-block" class="section-block">
        <div class="section-header">
          <h2 class="section-title">☀️ Rutina de Mañana</h2>
          <div class="season-toggle">
            <button id="btnInvierno" class="season-btn active" onclick="setSeason('invierno')">❄️ Inv</button>
            <button id="btnVerano"   class="season-btn"        onclick="setSeason('verano')">🌞 Ver</button>
          </div>
        </div>
        <div id="morningRoutine" class="steps-container"></div>
      </div>

      <!-- HINT noche (visible solo durante el día) -->
      <div id="night-hint" class="routine-hint" style="display:none">
        🌙 La rutina de noche aparecerá aquí a partir de las 21:00
      </div>

      <!-- ALERTA OLAY -->
      <div id="nightAlert" class="night-alert"></div>

      <!-- RUTINA NOCHE -->
      <div id="night-block" class="section-block" style="display:none">
        <h2 class="section-title">🌙 Rutina de Esta Noche</h2>
        <div id="nightRoutine" class="steps-container"></div>
      </div>

      <!-- HINT mañana (visible solo durante la noche) -->
      <div id="morning-hint" class="routine-hint" style="display:none">
        ☀️ La rutina de mañana aparecerá a partir de las 6:00
      </div>

    </section>

    <!-- TAB: MAÑANA -->
    <section id="tab-manana" class="tab-content" role="tabpanel" style="display:none">
      <div class="section-block">
        <div class="section-header">
          <h2 class="section-title">☀️ Rutina Completa de Mañana</h2>
          <div class="season-toggle">
            <button id="btnInviernoM" class="season-btn active" onclick="setSeasonManana('invierno')">❄️ Inv</button>
            <button id="btnVeranoM"   class="season-btn"        onclick="setSeasonManana('verano')">🌞 Ver</button>
          </div>
        </div>
        <div id="morningFullList"></div>
      </div>
    </section>

    <!-- TAB: SEMANA -->
    <section id="tab-semana" class="tab-content" role="tabpanel" style="display:none">
      <div class="section-block">
        <h2 class="section-title">📅 Calendario Semanal de Noches</h2>
        <div id="nightCalendar"></div>
      </div>
    </section>

    <!-- TAB: TIPS -->
    <section id="tab-tips" class="tab-content" role="tabpanel" style="display:none">
      <div class="section-block">
        <h2 class="section-title">💡 Recordatorios de Oro</h2>
        <div id="tipsList"></div>
      </div>
    </section>

  </div><!-- /app -->

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
