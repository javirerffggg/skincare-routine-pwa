<!DOCTYPE html>
<html lang="es" data-theme="day" data-phase="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="metaThemeColor" content="#FFF5F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Glow" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  
  <!-- Fonts: Playfair para el toque Vogue y Inter para lectura técnica -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
  <title>✨ The Glow — Puerto Real Edition</title>
</head>
<body>

  <!-- Capa 0: Aura WebGL (Fondo Dinámico) -->
  <canvas id="meshCanvas" aria-hidden="true"></canvas>
  
  <!-- Capa 1: Partículas de Luz y Clima -->
  <canvas id="weatherCanvas" aria-hidden="true"></canvas>
  
  <!-- Capa 2: Ruido Cinematográfico (Textura Premium) -->
  <canvas id="grainCanvas" aria-hidden="true"></canvas>

  <!-- Contenedor Principal (Respetando Concepto "Ma") -->
  <div id="app">
    <header class="header">
      <div class="header-content">
        <h1>The Glow</h1>
        <p class="header-sub" id="currentDate"></p>
        <p class="circadian-label" id="circadianLabel">Sincronizando con el sol...</p>
      </div>
      <!-- Pill de Temporada Dinámico -->
      <div class="season-pill glass-surface" id="seasonPill">
        <span id="seasonIcon">❄️</span>
        <span id="seasonText">Invierno</span>
      </div>
    </header>

    <main class="main-content">
      <!-- Sección de Progreso (Anillo de Cristal Corregido) -->
      <section class="progress-section">
        <div class="glass-ring-container">
          <svg class="glass-ring-svg" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--c-accent-light)" />
                <stop offset="100%" stop-color="var(--c-accent)" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="50" cy="50" r="45" />
            <circle id="ringLiquid" class="ring-liquid" cx="50" cy="50" r="45" transform="rotate(-90 50 50)" />
          </svg>
          <div class="ring-glare"></div>
          <div class="ring-center">
            <span id="ringCount" class="ring-number">0/4</span>
            <span class="ring-label">PASOS</span>
          </div>
        </div>
        <div class="progress-info">
          <h2 id="phaseTitle">Amanecer</h2>
          <p id="phaseDesc">Tu ritual de activación está listo.</p>
        </div>
      </section>

      <!-- Rutina Dinámica -->
      <div id="routineContainer" class="staggered-list">
        <!-- Inyectado por app.js -->
      </div>
    </main>

    <!-- Floating Action Dock (The Jewelry) -->
    <nav class="floating-dock">
      <button class="dock-btn active" data-tab="hoy"><span class="icon">🗓</span><span class="label">Hoy</span></button>
      <button class="dock-btn" data-tab="noche"><span class="icon">🌙</span><span class="label">Ciclo</span></button>
      <div class="dock-aura"></div>
      <button class="dock-btn" data-tab="tips"><span class="icon">💡</span><span class="label">Tips</span></button>
    </nav>
  </div>

  <!-- Scripts en orden de jerarquía -->
  <script src="app.js"></script>
  <script src="atmosphere.js"></script>
  <script src="features.js"></script>
</body>
</html>
